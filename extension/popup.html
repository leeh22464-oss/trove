<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --ac:#90e203; --n10:#1a1a19; --n30:#4d4f4a; --n50:#81837c; --n90:#e6e6e5; --n96:#f5f5f4; }
  * { box-sizing: border-box; margin: 0; font-family: -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei UI",sans-serif; }
  body { width: 300px; padding: 14px; background: #fff; color: var(--n10); }
  h1 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  h1::before { content:''; width: 8px; height: 8px; border-radius: 50%; background: var(--ac); }
  .meta { font-size: 12px; color: var(--n50); margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  textarea { width: 100%; min-height: 80px; padding: 8px; border: 1px solid var(--n90); border-radius: 8px; font: inherit; font-size: 13px; resize: vertical; outline: none; }
  textarea:focus { border-color: var(--n30); }
  .row { display: flex; gap: 6px; margin-top: 10px; }
  button { flex: 1; padding: 8px 0; border: 0; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--n96); color: var(--n10); transition: background .15s; }
  button:hover { background: var(--n90); }
  button.pri { background: var(--ac); }
  button.pri:hover { filter: brightness(1.05); }
  .stat { font-size: 12px; margin-top: 10px; min-height: 16px; }
  .stat.ok { color: #1d724a; } .stat.err { color: #7b2214; }
  .opts { margin-top: 8px; font-size: 12px; color: var(--n50); cursor: pointer; text-align: center; }
  .opts:hover { color: var(--n10); }
</style>
</head>
<body>
  <h1>保存到 Catch</h1>
  <div class="meta" id="meta">读取当前页…</div>
  <textarea id="text" placeholder="粘贴内容，或留空保存当前页链接"></textarea>
  <div class="row">
    <button id="saveSel">存选区</button>
    <button id="saveText">存文本</button>
    <button id="savePage" class="pri">存页面</button>
  </div>
  <div class="stat" id="stat"></div>
  <div class="opts" id="opts">设置服务地址 / token</div>
  <script src="popup.js"></script>
</body>
</html>
